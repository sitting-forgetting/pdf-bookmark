<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF 图书自动编目</title>
<link rel="icon" href="data:,">
<style>
  /* ============================================================
     设计基调：浅色、克制、工具感。
     不使用渐变、外部字体、图标库或任何外部资源。
     ============================================================ */
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --surface-soft: #fafbfc;
    --line: #e4e7eb;
    --line-strong: #d3d9e0;
    --text: #202a35;
    --text-2: #48525e;
    --muted: #6b7683;
    --faint: #98a2ad;
    --accent: #2f5d8a;
    --accent-dark: #264b70;
    --accent-soft: #eef3f8;
    --ok: #2f7d5d;
    --ok-soft: #edf6f1;
    --ok-line: #d3e7dc;
    --warn: #8a6a37;
    --warn-soft: #fbf5e8;
    --warn-line: #eadfc6;
    --danger: #b0463d;
    --danger-soft: #fbefee;
    --danger-line: #f0d6d2;
    --level-1: #34485f;
    --level-2: #7f93a7;
    --level-3: #bcc8d4;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(20, 30, 40, .04), 0 6px 16px rgba(20, 30, 40, .035);
  }

  *,
  *::before,
  *::after { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  button,
  input,
  select { font: inherit; color: inherit; }

  button { cursor: pointer; }

  [hidden] { display: none !important; }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  /* ---------- 页面骨架 ---------- */
  .app-header {
    max-width: 1120px;
    margin: 0 auto;
    padding: 28px 24px 12px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
  }

  .app-title {
    margin: 0;
    font-size: 20px;
    font-weight: 600;
    line-height: 1.35;
    letter-spacing: .01em;
  }

  .app-sub {
    margin: 5px 0 0;
    max-width: 620px;
    color: var(--muted);
    font-size: 13px;
  }

  .header-tools {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    padding-top: 2px;
  }

  .page {
    max-width: 1120px;
    margin: 0 auto;
    padding: 8px 24px 72px;
  }

  .app-footer {
    max-width: 1120px;
    margin: 0 auto;
    padding: 0 24px 32px;
    color: var(--faint);
    font-size: 11.5px;
    text-align: center;
  }

  /* ---------- 按钮 ---------- */
  .btn {
    appearance: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 32px;
    padding: 0 13px;
    border: 1px solid var(--line-strong);
    border-radius: 6px;
    background: var(--surface);
    color: var(--text-2);
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    transition: background-color .15s ease, border-color .15s ease, color .15s ease;
  }

  .btn:hover {
    background: #f7f8fa;
    border-color: #c8cfd7;
    color: var(--text);
  }

  .btn:focus-visible {
    outline: 2px solid #9db8d2;
    outline-offset: 2px;
  }

  .btn:disabled {
    opacity: .55;
    cursor: not-allowed;
  }

  .btn-primary {
    border-color: var(--accent);
    background: var(--accent);
    color: #fff;
  }

  .btn-primary:hover {
    background: var(--accent-dark);
    border-color: var(--accent-dark);
    color: #fff;
  }

  .btn-small {
    height: 28px;
    padding: 0 10px;
    font-size: 12px;
  }

  .btn-ghost {
    height: 26px;
    padding: 0 8px;
    border-color: transparent;
    background: transparent;
    color: var(--muted);
    font-weight: 400;
  }

  .btn-ghost:hover {
    background: #f1f3f5;
    border-color: transparent;
    color: var(--text);
  }

  .btn-ghost.is-danger {
    color: var(--danger);
    background: var(--danger-soft);
  }

  .build-btn {
    height: 34px;
    padding: 0 16px;
  }

  /* ---------- 后端状态 ---------- */
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 30px;
    padding: 0 11px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--surface);
    color: var(--muted);
    font-size: 12px;
    white-space: nowrap;
  }

  .pill-dot {
    flex: none;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--faint);
  }

  .pill[data-state="checking"] .pill-dot { animation: pulse 1.2s ease-in-out infinite; }

  .pill[data-state="ok"] {
    border-color: var(--ok-line);
    background: var(--ok-soft);
    color: #2f6a52;
  }

  .pill[data-state="ok"] .pill-dot { background: #3d8a68; }

  .pill[data-state="bad"] {
    border-color: var(--danger-line);
    background: var(--danger-soft);
    color: var(--danger);
  }

  .pill[data-state="bad"] .pill-dot { background: #b9544a; }

  .banner {
    margin: 0 0 16px;
    padding: 10px 13px;
    border: 1px solid var(--danger-line);
    border-radius: 6px;
    background: var(--danger-soft);
    color: #8e3b34;
    font-size: 12.5px;
    line-height: 1.65;
  }

  /* ---------- 拖放区 ---------- */
  .dropzone {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 18px 20px;
    margin: 0 0 14px;
    border: 1px dashed var(--line-strong);
    border-radius: var(--radius);
    background: rgba(255, 255, 255, .68);
  }

  .dropzone-icon {
    flex: none;
    width: 32px;
    height: 36px;
    color: var(--faint);
  }

  .dropzone-text { flex: 1; min-width: 0; }

  .dropzone-title {
    margin: 0;
    font-size: 14px;
    font-weight: 600;
  }

  .dropzone-sub {
    margin: 2px 0 0;
    color: var(--muted);
    font-size: 12.5px;
  }

  .queue-note {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 0 12px;
    color: var(--muted);
    font-size: 12.5px;
    font-variant-numeric: tabular-nums;
  }

  .spinner {
    flex: none;
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid #ccd8e4;
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .9s linear infinite;
    vertical-align: -2px;
  }

  .spinner-small {
    width: 11px;
    height: 11px;
    border-width: 1.5px;
  }

  /* ---------- 任务卡片 ---------- */
  .cards {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .card-head { padding: 16px 18px; }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }

  .name-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    min-width: 0;
  }

  .file-name {
    margin: 0;
    font-size: 15.5px;
    font-weight: 600;
    line-height: 1.45;
    overflow-wrap: anywhere;
  }

  .badge {
    flex: none;
    display: inline-flex;
    align-items: center;
    height: 21px;
    padding: 0 8px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: #f2f4f6;
    color: var(--muted);
    font-size: 11.5px;
    font-weight: 500;
    white-space: nowrap;
  }

  .badge::before {
    content: "";
    width: 5px;
    height: 5px;
    margin-right: 5px;
    border-radius: 50%;
    background: currentColor;
    opacity: .65;
  }

  .badge[data-status="analyzing"],
  .badge[data-status="building"] {
    border-color: #d8e3ee;
    background: var(--accent-soft);
    color: #365c7f;
  }

  .badge[data-status="done"] {
    border-color: var(--ok-line);
    background: var(--ok-soft);
    color: var(--ok);
  }

  .badge[data-status="error"] {
    border-color: var(--danger-line);
    background: var(--danger-soft);
    color: var(--danger);
  }

  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 16px;
    margin: 9px 0 0;
    font-size: 12.5px;
    color: var(--text-2);
  }

  .meta-item {
    display: inline-flex;
    align-items: baseline;
    gap: 5px;
    min-width: 0;
  }

  .meta-key {
    color: var(--faint);
    font-size: 11.5px;
  }

  .meta-val {
    color: var(--text-2);
    font-variant-numeric: tabular-nums;
    overflow-wrap: anywhere;
  }

  .job-line {
    margin: 6px 0 0;
    color: var(--faint);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11px;
    overflow-wrap: anywhere;
  }

  /* ---------- 状态面板 ---------- */
  .status-panel {
    padding: 14px 18px;
    border-top: 1px solid var(--line);
    background: var(--surface-soft);
  }

  .status-title {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0;
    color: var(--text);
    font-size: 13px;
    font-weight: 500;
  }

  .status-sub {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 12.5px;
  }

  .progress-track {
    height: 4px;
    margin-top: 12px;
    border-radius: 2px;
    background: #e7ebef;
    overflow: hidden;
  }

  .progress-bar {
    width: 30%;
    height: 100%;
    border-radius: 2px;
    background: #54789b;
    animation: indeterminate 1.6s ease-in-out infinite;
  }

  .status-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 8px;
    color: var(--faint);
    font-size: 11.5px;
  }

  .elapsed {
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  /* ---------- 提示条 ---------- */
  .alert {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 8px 12px;
    padding: 9px 11px;
    border: 1px solid transparent;
    border-radius: 6px;
    font-size: 12.5px;
    line-height: 1.65;
  }

  .alert p { margin: 0; }

  .status-panel .alert { margin: 0; }

  .alert-text {
    flex: 1;
    min-width: 180px;
    overflow-wrap: anywhere;
  }

  .alert-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .alert-error {
    border-color: var(--danger-line);
    background: var(--danger-soft);
    color: #8e3b34;
  }

  .alert-ok {
    border-color: var(--ok-line);
    background: var(--ok-soft);
    color: #2c6450;
  }

  .alert-warn {
    border-color: var(--warn-line);
    background: var(--warn-soft);
    color: var(--warn);
  }

  .alert a {
    color: inherit;
    font-weight: 500;
    text-decoration: underline;
    text-underline-offset: 2px;
    white-space: nowrap;
  }

  /* ---------- 目录表格 ---------- */
  .result { border-top: 1px solid var(--line); }

  .toc-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 11px 18px;
    border-bottom: 1px solid var(--line);
    background: var(--surface-soft);
  }

  .toc-stats {
    margin: 0;
    color: var(--muted);
    font-size: 12.5px;
    font-variant-numeric: tabular-nums;
  }

  .notice-slot:empty,
  .build-alert-slot:empty { display: none; }

  .notice-slot .alert { margin: 12px 18px; }

  .table-wrap {
    max-height: 58vh;
    overflow: auto;
    overscroll-behavior: contain;
  }

  .table-wrap.is-locked {
    pointer-events: none;
    opacity: .82;
  }

  .toc-table {
    width: 100%;
    min-width: 660px;
    border-collapse: separate;
    border-spacing: 0;
    table-layout: fixed;
    font-size: 13px;
  }

  .col-level { width: 74px; }
  .col-printed { width: 90px; }
  .col-page { width: 104px; }
  .col-action { width: 66px; }

  .toc-table th {
    position: sticky;
    top: 0;
    z-index: 2;
    padding: 8px 10px;
    border-bottom: 1px solid var(--line);
    background: #f8f9fb;
    color: var(--faint);
    font-size: 11.5px;
    font-weight: 500;
    text-align: left;
    white-space: nowrap;
  }

  .toc-table th.num { text-align: right; }

  .toc-table td {
    padding: 4px 10px;
    border-bottom: 1px solid #eef1f4;
    vertical-align: middle;
  }

  .toc-table tbody tr:last-child td { border-bottom: 0; }

  .toc-row:hover td { background: #fbfcfd; }
  .toc-row:focus-within td { background: #f8fafc; }

  .toc-row td:first-child {
    position: relative;
    padding-left: 16px;
  }

  .toc-row td:first-child::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 4px;
    background: var(--row-color, transparent);
  }

  .toc-row.level-1 { --row-color: var(--level-1); }
  .toc-row.level-2 { --row-color: var(--level-2); }
  .toc-row.level-3 { --row-color: var(--level-3); }

  .cell-input,
  .level-select {
    width: 100%;
    height: 30px;
    padding: 0 7px;
    border: 1px solid transparent;
    border-radius: 4px;
    background: transparent;
    color: var(--text);
    font-size: 13px;
  }

  .cell-input:hover,
  .level-select:hover {
    border-color: #e6e9ed;
    background: #fff;
  }

  .cell-input:focus,
  .level-select:focus {
    outline: none;
    border-color: #a9bfd4;
    background: #fff;
    box-shadow: 0 0 0 2px rgba(47, 93, 138, .10);
  }

  .cell-input.is-invalid,
  .cell-input.is-invalid:focus {
    border-color: #cf827a;
    background: #fff8f7;
    box-shadow: 0 0 0 2px rgba(176, 70, 61, .10);
  }

  .title-cell {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }

  .title-input {
    flex: 1;
    min-width: 0;
  }

  .level-1 .title-input { padding-left: 6px; }
  .level-2 .title-input { padding-left: 20px; }
  .level-3 .title-input { padding-left: 34px; }

  .note-chip {
    flex: none;
    padding: 1px 6px;
    border-radius: 4px;
    background: var(--warn-soft);
    color: var(--warn);
    font-size: 11px;
    white-space: nowrap;
  }

  .level-select {
    padding-left: 4px;
    color: var(--text-2);
    font-size: 12.5px;
    cursor: pointer;
  }

  .page-input {
    padding-right: 6px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .page-input::-webkit-outer-spin-button,
  .page-input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  .page-input[type="number"] {
    appearance: textfield;
    -moz-appearance: textfield;
  }

  .printed-val {
    display: block;
    padding-right: 7px;
    color: var(--text-2);
    font-size: 13px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .printed-val.is-missing { color: var(--faint); }

  .del-btn {
    height: 26px;
    padding: 0 7px;
    border: 1px solid transparent;
    border-radius: 4px;
    background: transparent;
    color: var(--faint);
    font-size: 12px;
  }

  .del-btn:hover {
    border-color: var(--danger-line);
    background: var(--danger-soft);
    color: var(--danger);
  }

  .del-btn:focus-visible {
    outline: 2px solid #d9a6a1;
    outline-offset: 1px;
  }

  .empty-row td {
    padding: 22px 10px;
    color: var(--faint);
    font-size: 12.5px;
    text-align: center;
  }

  .build-alert-slot .alert { margin: 12px 18px; }

  .card-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    padding: 12px 18px;
    border-top: 1px solid var(--line);
    background: var(--surface-soft);
  }

  .build-hint {
    margin: 0;
    color: var(--muted);
    font-size: 12px;
  }

  .build-hint.is-working { color: var(--accent); }

  /* ---------- 空列表 ---------- */
  .empty-hint {
    margin: 18px 0 0;
    padding: 24px 18px;
    border: 1px dashed var(--line);
    border-radius: var(--radius);
    background: rgba(255, 255, 255, .5);
    color: var(--faint);
    font-size: 13px;
    text-align: center;
  }

  /* ---------- 全页拖放反馈 ---------- */
  .drop-overlay {
    position: fixed;
    inset: 0;
    z-index: 70;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px;
    background: rgba(244, 246, 248, .88);
    pointer-events: none;
  }

  .drop-frame {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    max-width: 760px;
    min-height: 320px;
    border: 2px dashed var(--accent);
    border-radius: 12px;
    background: rgba(255, 255, 255, .74);
    text-align: center;
  }

  .drop-title {
    margin: 0;
    color: var(--text);
    font-size: 18px;
    font-weight: 600;
  }

  .drop-sub {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
  }

  /* ---------- 轻量提示 ---------- */
  .toasts {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 90;
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: min(360px, calc(100vw - 32px));
    pointer-events: none;
  }

  .toast {
    pointer-events: auto;
    padding: 9px 12px;
    border-radius: 6px;
    background: #25313d;
    color: #f6f8fa;
    font-size: 12.5px;
    line-height: 1.55;
    box-shadow: 0 8px 24px rgba(20, 30, 40, .18);
    opacity: 0;
    transform: translateY(4px);
    transition: opacity .18s ease, transform .18s ease;
    overflow-wrap: anywhere;
  }

  .toast.is-visible {
    opacity: 1;
    transform: translateY(0);
  }

  .toast[data-tone="ok"] { background: #2b5f49; }
  .toast[data-tone="error"] { background: #7c3a34; }
  .toast[data-tone="warn"] { background: #5e4c2f; }

  /* ---------- 动画 ---------- */
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @keyframes indeterminate {
    0% { transform: translateX(-110%); }
    100% { transform: translateX(370%); }
  }

  @keyframes pulse {
    0%, 100% { opacity: .35; }
    50% { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }

    .progress-bar {
      width: 100%;
      animation: none;
      opacity: .45;
    }
  }

  /* ---------- 窄屏 ---------- */
  @media (max-width: 720px) {
    .app-header { padding: 20px 14px 10px; }
    .app-title { font-size: 18px; }
    .header-tools { width: 100%; }
    .page { padding: 6px 14px 56px; }
    .app-footer { padding: 0 14px 24px; }

    .dropzone {
      flex-wrap: wrap;
      gap: 10px;
      padding: 16px;
    }

    .dropzone-text { flex-basis: calc(100% - 50px); }
    .dropzone .btn { width: 100%; }

    .card-head,
    .status-panel,
    .toc-toolbar,
    .card-foot { padding-left: 14px; padding-right: 14px; }

    .notice-slot .alert,
    .build-alert-slot .alert { margin-left: 14px; margin-right: 14px; }

    .card-foot {
      align-items: stretch;
      flex-direction: column;
    }

    .build-btn { width: 100%; }
  }
</style>
</head>
<body>

<header class="app-header">
  <div>
    <h1 class="app-title">PDF 图书自动编目</h1>
    <p class="app-sub">识别书前目录页与印刷页码，校对后写入可点击书签。原 PDF 不会被修改。</p>
  </div>
  <div class="header-tools">
    <span class="pill" id="backendPill" data-state="checking" role="status">
      <span class="pill-dot" aria-hidden="true"></span>
      <span id="backendPillText">正在检测后端…</span>
    </span>
    <button class="btn" id="pingBtn" type="button">重新检测</button>
    <button class="btn btn-primary" type="button" data-action="pick">选择文件</button>
  </div>
</header>

<main class="page" id="main">
  <div class="banner" id="backendBanner" hidden role="alert"></div>

  <section class="dropzone" aria-label="PDF 拖放区">
    <svg class="dropzone-icon" viewBox="0 0 32 36" aria-hidden="true" focusable="false">
      <path d="M6 2.5h12.5l7.5 7.5V33a1.5 1.5 0 0 1-1.5 1.5h-18A1.5 1.5 0 0 1 5 33V4A1.5 1.5 0 0 1 6.5 2.5z"
            fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M18.5 3v7h7"
            fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M10 18h12M10 22.5h12M10 27h8"
            fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <div class="dropzone-text">
      <p class="dropzone-title">把 PDF 拖到窗口任意位置</p>
      <p class="dropzone-sub">支持一次拖入多个文件，按顺序逐个识别；也可以点「选择文件」。</p>
    </div>
    <button class="btn" type="button" data-action="pick">选择文件</button>
  </section>

  <div class="queue-note" id="queueNote" hidden aria-live="polite">
    <span class="spinner spinner-small" id="queueSpinner" aria-hidden="true"></span>
    <span id="queueNoteText"></span>
  </div>

  <div class="cards" id="cards"></div>

  <p class="empty-hint" id="emptyHint">还没有任务。把 PDF 拖进窗口，或点「选择文件」开始。</p>
</main>

<footer class="app-footer">本地运行 · PDF 与识别结果不离开这台电脑</footer>

<!-- 单张任务卡的结构模板；所有用户内容都由 JS 用 textContent / value 填入 -->
<template id="cardTemplate">
  <article class="card">
    <header class="card-head">
      <div class="card-top">
        <div class="name-wrap">
          <h2 class="file-name"></h2>
          <span class="badge" data-status="queued">排队中</span>
        </div>
        <button class="btn btn-ghost remove-btn" type="button">移除</button>
      </div>
      <div class="meta" hidden></div>
      <p class="job-line" hidden></p>
    </header>

    <div class="status-slot" aria-live="polite"></div>

    <div class="result" hidden>
      <div class="toc-toolbar">
        <p class="toc-stats"></p>
        <button class="btn btn-small collapse-btn" type="button" aria-expanded="true">收起目录</button>
      </div>

      <div class="notice-slot"></div>

      <div class="table-wrap">
        <table class="toc-table">
          <caption class="sr-only">可编辑的目录条目</caption>
          <colgroup>
            <col class="col-level">
            <col class="col-title">
            <col class="col-printed">
            <col class="col-page">
            <col class="col-action">
          </colgroup>
          <thead>
            <tr>
              <th scope="col">层级</th>
              <th scope="col">标题</th>
              <th scope="col" class="num">印刷页码</th>
              <th scope="col" class="num">PDF 页码</th>
              <th scope="col" class="action-col"><span class="sr-only">操作</span></th>
            </tr>
          </thead>
          <tbody class="toc-body"></tbody>
        </table>
      </div>

      <div class="build-alert-slot" aria-live="polite"></div>

      <footer class="card-foot">
        <p class="build-hint">确认目录无误后生成，原 PDF 不会被修改。</p>
        <button class="btn btn-primary build-btn" type="button">生成带书签的 PDF</button>
      </footer>
    </div>
  </article>
</template>

<div class="drop-overlay" id="dropOverlay" hidden aria-hidden="true">
  <div class="drop-frame">
    <p class="drop-title">松开鼠标，开始识别目录</p>
    <p class="drop-sub">支持一次拖入多个 PDF，会按顺序逐个分析</p>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<input type="file" id="fileInput" accept="application/pdf" multiple hidden>

<noscript>
  <div style="max-width:720px;margin:24px auto;padding:14px 18px;border:1px solid #f0d6d2;background:#fbefee;color:#8e3b34;font-size:13px;">
    这个页面需要启用 JavaScript 才能使用。
  </div>
</noscript>

<script>
(function () {
  "use strict";

  /* ============================================================
     常量与全局状态
     ============================================================ */
  var API = {
    ping: "/api/ping",
    analyze: "/api/analyze",
    build: "/api/build",
    download: function (jobId) {
      return "/api/download?id=" + encodeURIComponent(jobId);
    }
  };

  var KIND_FALLBACK = {
    scan: "扫描件（无文字层）",
    text: "文字版",
    mixed: "混合（部分页有文字层）"
  };

  var STATUS_LABELS = {
    idle: "排队中",
    queued: "排队中",
    analyzing: "正在识别",
    ready: "待生成",
    building: "正在生成",
    done: "已生成",
    error: "识别失败"
  };

  var DEFAULT_BUILD_HINT = "确认目录无误后生成，原 PDF 不会被修改。";

  var state = {
    cards: new Map(),   // cardId -> card 对象
    queue: [],          // 等待分析的任务，先进先出
    pumping: false,     // 是否已有队列循环在跑
    sequence: 0,
    dragDepth: 0,
    pingRunning: false
  };

  /* ============================================================
     静态 DOM 引用
     ============================================================ */
  var cardsRoot = document.getElementById("cards");
  var cardTemplate = document.getElementById("cardTemplate");
  var fileInput = document.getElementById("fileInput");
  var emptyHint = document.getElementById("emptyHint");
  var dropOverlay = document.getElementById("dropOverlay");
  var toastsRoot = document.getElementById("toasts");
  var queueNote = document.getElementById("queueNote");
  var queueNoteText = document.getElementById("queueNoteText");
  var queueSpinner = document.getElementById("queueSpinner");
  var backendPill = document.getElementById("backendPill");
  var backendPillText = document.getElementById("backendPillText");
  var backendBanner = document.getElementById("backendBanner");
  var pingBtn = document.getElementById("pingBtn");

  /* ============================================================
     通用小工具
     ============================================================ */

  // 创建元素。用户内容只通过 textContent / value 写入，不拼接 innerHTML。
  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }

  function isPdfFile(file) {
    var name = String(file && file.name ? file.name : "").toLowerCase();
    return file.type === "application/pdf" || /\.pdf$/.test(name);
  }

  function describeKind(job) {
    if (job && typeof job.kind_cn === "string" && job.kind_cn.trim()) {
      return job.kind_cn.trim();
    }
    if (job && KIND_FALLBACK[job.kind]) return KIND_FALLBACK[job.kind];
    return "未知类型";
  }

  function describeOcr(ocr) {
    if (!ocr) return "";
    var key = String(ocr).toLowerCase();
    if (key === "vision") return "OCR：Vision";
    if (key === "tesseract") return "OCR：Tesseract";
    return "OCR：" + ocr;
  }

  function formatSeconds(value) {
    var seconds = Number(value);
    if (!Number.isFinite(seconds) || seconds < 0) return "—";
    if (seconds < 60) {
      return (Math.round(seconds * 10) / 10) + " 秒";
    }
    var total = Math.round(seconds);
    return Math.floor(total / 60) + " 分 " + String(total % 60).padStart(2, "0") + " 秒";
  }

  function formatElapsedClock(value) {
    var total = Math.max(0, Math.floor(Number(value) || 0));
    if (total < 60) return total + " 秒";
    return Math.floor(total / 60) + " 分 " + String(total % 60).padStart(2, "0") + " 秒";
  }

  function formatOffset(value) {
    var offset = Number(value);
    if (!Number.isFinite(offset)) return "—";
    return offset > 0 ? "+" + offset : String(offset);
  }

  // 目录页可能是连续区间，也可能是分散的几页。
  function formatTocPages(pages) {
    if (!Array.isArray(pages) || pages.length === 0) return "未识别到";
    var numbers = [];
    pages.forEach(function (page) {
      var n = Number(page);
      if (Number.isInteger(n) && numbers.indexOf(n) === -1) numbers.push(n);
    });
    numbers.sort(function (a, b) { return a - b; });
    if (numbers.length === 0) return "未识别到";
    if (numbers.length === 1) return "第 " + numbers[0] + " 页";

    var consecutive = numbers.every(function (n, index) {
      return index === 0 || n === numbers[index - 1] + 1;
    });
    if (consecutive) {
      return "第 " + numbers[0] + "–" + numbers[numbers.length - 1] +
        " 页（共 " + numbers.length + " 页）";
    }
    if (numbers.length <= 5) {
      return numbers.map(function (n) { return "第 " + n + " 页"; }).join("、");
    }
    return "第 " + numbers[0] + "、" + numbers[1] + " … " +
      numbers[numbers.length - 1] + " 页（共 " + numbers.length + " 页）";
  }

  function metaItem(label, value, tooltip) {
    var item = el("span", "meta-item");
    item.appendChild(el("span", "meta-key", label));
    item.appendChild(el("span", "meta-val", value));
    if (tooltip) item.title = tooltip;
    return item;
  }

  /* ============================================================
     网络请求
     ============================================================ */

  // 统一处理：网络失败、非 JSON、HTTP 错误。HTTP 200 + ok:false 由 assertOk 处理。
  async function fetchJson(url, options) {
    var response;
    try {
      response = await fetch(url, Object.assign({ cache: "no-store" }, options || {}));
    } catch (error) {
      throw new Error("无法连接后端服务，请确认本地服务仍在运行，然后重试。");
    }

    var raw = await response.text();
    var data = null;
    if (raw) {
      try { data = JSON.parse(raw); } catch (error) { data = null; }
    }

    if (!response.ok) {
      if (data && typeof data.error === "string" && data.error.trim()) {
        throw new Error(data.error.trim());
      }
      throw new Error("后端返回了 HTTP " + response.status + "，请稍后重试。");
    }
    if (!data || typeof data !== "object") {
      throw new Error("后端返回的内容无法解析。");
    }
    return data;
  }

  function assertOk(data, fallbackMessage) {
    if (data && data.ok === true) return data;
    var message = data && typeof data.error === "string" && data.error.trim()
      ? data.error.trim()
      : fallbackMessage;
    throw new Error(message);
  }

  // 只接受后端常见的相对下载地址，避免异常协议被自动点击。
  function resolveDownloadUrl(rawUrl, jobId) {
    var fallback = API.download(jobId);
    if (typeof rawUrl !== "string" || !rawUrl.trim()) return fallback;
    var url = rawUrl.trim();
    return url.charAt(0) === "/" ? url : fallback;
  }

  /* ============================================================
     提示
     ============================================================ */

  function showToast(message, tone, duration) {
    var toast = el("div", "toast", message);
    toast.dataset.tone = tone || "info";
    toast.setAttribute("role", "status");
    toastsRoot.appendChild(toast);

    while (toastsRoot.children.length > 4) {
      toastsRoot.removeChild(toastsRoot.firstElementChild);
    }

    window.requestAnimationFrame(function () {
      toast.classList.add("is-visible");
    });

    window.setTimeout(function () {
      toast.classList.remove("is-visible");
      window.setTimeout(function () { toast.remove(); }, 220);
    }, duration || 4200);
  }

  /* ============================================================
     后端状态
     ============================================================ */

  async function checkBackend() {
    if (state.pingRunning) return;
    state.pingRunning = true;
    backendPill.dataset.state = "checking";
    backendPillText.textContent = "正在检测后端…";
    pingBtn.disabled = true;

    try {
      var data = await fetchJson(API.ping);
      assertOk(data, "后端服务尚未就绪。");
      var ocr = describeOcr(data.ocr);
      backendPill.dataset.state = "ok";
      backendPillText.textContent = ocr ? "后端已就绪 · " + ocr : "后端已就绪";
      backendPill.title = "GET /api/ping 正常";
      backendBanner.hidden = true;
    } catch (error) {
      backendPill.dataset.state = "bad";
      backendPillText.textContent = "后端未连接";
      backendPill.title = "";
      if (window.location.protocol === "file:") {
        backendBanner.textContent =
          "当前页面是直接以文件方式打开的，无法调用本地接口。请通过项目自带的本地服务打开本页面。";
      } else {
        backendBanner.textContent =
          "无法连接后端服务（" + error.message + "）。请确认本地服务仍在运行，然后点「重新检测」。";
      }
      backendBanner.hidden = false;
    } finally {
      state.pingRunning = false;
      pingBtn.disabled = false;
    }
  }

  /* ============================================================
     条数与队列
     ============================================================ */

  function countCards(status) {
    var count = 0;
    state.cards.forEach(function (card) {
      if (card.status === status) count += 1;
    });
    return count;
  }

  function updateEmptyHint() {
    emptyHint.hidden = state.cards.size > 0;
  }

  function updateQueueNote() {
    var running = countCards("analyzing");
    var queued = state.queue.filter(function (card) {
      return card.status === "queued";
    }).length;

    if (!running && !queued) {
      queueNote.hidden = true;
      return;
    }

    queueNote.hidden = false;
    queueSpinner.hidden = running === 0;

    if (running > 0) {
      queueNoteText.textContent = queued > 0
        ? "正在识别 1 个任务，队列中还有 " + queued + " 个"
        : "正在识别任务…";
    } else {
      queueNoteText.textContent = "队列中还有 " + queued + " 个任务待识别";
    }
  }

  function updateQueuedPositions() {
    var running = countCards("analyzing") > 0 ? 1 : 0;
    state.queue.forEach(function (card, index) {
      if (card.status !== "queued" || !card.queuedPosEl) return;
      var ahead = index + running;
      card.queuedPosEl.textContent = ahead > 0
        ? "前面还有 " + ahead + " 个任务，完成后会自动开始。"
        : "马上开始分析…";
    });
  }

  /* ============================================================
     卡片创建与状态
     ============================================================ */

  function createCard(file) {
    state.sequence += 1;
    var root = cardTemplate.content.firstElementChild.cloneNode(true);

    var card = {
      id: "task-" + state.sequence,
      file: file,
      job: null,
      status: "idle",
      failure: null,
      removeArmed: false,
      removeTimer: 0,
      elapsedTimer: 0,
      startedAt: 0,
      rowCount: 0,
      root: root
    };

    card.fileNameEl = root.querySelector(".file-name");
    card.badgeEl = root.querySelector(".badge");
    card.metaEl = root.querySelector(".meta");
    card.jobLineEl = root.querySelector(".job-line");
    card.removeBtn = root.querySelector(".remove-btn");
    card.statusSlot = root.querySelector(".status-slot");
    card.resultEl = root.querySelector(".result");
    card.statsEl = root.querySelector(".toc-stats");
    card.collapseBtn = root.querySelector(".collapse-btn");
    card.noticeSlot = root.querySelector(".notice-slot");
    card.tableWrap = root.querySelector(".table-wrap");
    card.tbody = root.querySelector(".toc-body");
    card.buildAlertSlot = root.querySelector(".build-alert-slot");
    card.buildBtn = root.querySelector(".build-btn");
    card.buildHint = root.querySelector(".build-hint");

    root.dataset.cardId = card.id;
    card.fileNameEl.textContent = file.name || "未命名.pdf";
    card.badgeEl.dataset.status = "queued";
    card.badgeEl.textContent = STATUS_LABELS.queued;

    bindCardEvents(card);
    cardsRoot.appendChild(root);
    state.cards.set(card.id, card);
    updateEmptyHint();

    return card;
  }

  function updateBadge(card) {
    var label = STATUS_LABELS[card.status] || "";
    if (card.status === "error" && card.failure && card.failure.stage === "build") {
      label = "生成失败";
    }
    card.badgeEl.textContent = label;
    card.badgeEl.dataset.status = card.status === "idle" ? "queued" : card.status;
  }

  function setStatus(card, status) {
    card.status = status;
    updateBadge(card);
    card.root.setAttribute(
      "aria-busy",
      status === "analyzing" || status === "building" ? "true" : "false"
    );
    if ((status === "analyzing" || status === "building") && card.removeArmed) {
      resetRemoveButton(card);
    }
  }

  function renderQueuedPanel(card) {
    card.statusSlot.hidden = false;
    var panel = el("div", "status-panel");
    var title = el("p", "status-title", "排队中");
    var sub = el("p", "status-sub", "等待队列中的前一个任务完成。");
    card.queuedPosEl = sub;
    panel.appendChild(title);
    panel.appendChild(sub);
    card.statusSlot.replaceChildren(panel);
  }

  function renderAnalyzingPanel(card) {
    card.statusSlot.hidden = false;
    stopElapsed(card);

    var panel = el("div", "status-panel");
    var title = el("p", "status-title");
    title.appendChild(el("span", "spinner"));
    title.appendChild(document.createTextNode("正在识别目录…"));

    var sub = el(
      "p",
      "status-sub",
      "正在逐页查找目录、识别条目并对齐页码。扫描版 600 页大约需要 25–100 秒，请保持页面打开。"
    );

    var track = el("div", "progress-track");
    track.appendChild(el("div", "progress-bar"));

    var foot = el("div", "status-foot");
    var elapsed = el("span", "elapsed", "已用时 0 秒");
    foot.appendChild(elapsed);
    foot.appendChild(el("span", "", "目录页 → 页码偏移 → 条目对齐"));

    panel.appendChild(title);
    panel.appendChild(sub);
    panel.appendChild(track);
    panel.appendChild(foot);
    card.statusSlot.replaceChildren(panel);

    card.elapsedEl = elapsed;
    card.startedAt = Date.now();
    card.elapsedTimer = window.setInterval(function () {
      if (card.status !== "analyzing" || !card.elapsedEl) return;
      card.elapsedEl.textContent = "已用时 " +
        formatElapsedClock((Date.now() - card.startedAt) / 1000);
    }, 1000);
  }

  function renderAnalyzeError(card) {
    card.statusSlot.hidden = false;
    var panel = el("div", "status-panel");
    var alertBox = el("div", "alert alert-error");
    var message = card.failure && card.failure.message
      ? card.failure.message
      : "识别失败，但后端没有返回原因。";
    alertBox.appendChild(el("span", "alert-text", "识别失败：" + message));

    var actions = el("div", "alert-actions");
    var retry = el("button", "btn btn-small", "重试分析");
    retry.type = "button";
    retry.disabled = !card.file;
    retry.addEventListener("click", function () { retryAnalyze(card); });
    actions.appendChild(retry);
    alertBox.appendChild(actions);

    panel.appendChild(alertBox);
    card.statusSlot.replaceChildren(panel);
  }

  function stopElapsed(card) {
    if (card.elapsedTimer) {
      window.clearInterval(card.elapsedTimer);
      card.elapsedTimer = 0;
    }
  }

  /* ============================================================
     目录表格
     ============================================================ */

  function normalizeLevel(value) {
    var level = parseInt(value, 10);
    if (!Number.isFinite(level)) level = 1;
    return Math.min(3, Math.max(1, level));
  }

  function applyRowLevel(row, level) {
    var normalized = normalizeLevel(level);
    row.classList.remove("level-1", "level-2", "level-3");
    row.classList.add("level-" + normalized);
    row.dataset.level = String(normalized);
  }

  function createTocRow(item, pages) {
    var level = normalizeLevel(item.level);
    var row = document.createElement("tr");
    row.className = "toc-row level-" + level;
    row.dataset.level = String(level);

    // 层级
    var levelCell = el("td");
    var levelSelect = el("select", "level-select");
    levelSelect.setAttribute("aria-label", "层级");
    [1, 2, 3].forEach(function (value) {
      var option = el("option", "", value + " 级");
      option.value = String(value);
      levelSelect.appendChild(option);
    });
    levelSelect.value = String(level);
    levelCell.appendChild(levelSelect);

    // 标题 + 识别提示
    var titleCell = el("td");
    var titleWrap = el("div", "title-cell");
    var titleInput = el("input", "cell-input title-input");
    titleInput.type = "text";
    titleInput.spellcheck = false;
    titleInput.setAttribute("aria-label", "标题");
    titleInput.value = item.title === null || item.title === undefined
      ? ""
      : String(item.title);
    titleWrap.appendChild(titleInput);

    var note = typeof item.note === "string" ? item.note.trim() : "";
    if (note) {
      var noteChip = el("span", "note-chip", note);
      noteChip.title = note;
      titleWrap.appendChild(noteChip);
    }
    titleCell.appendChild(titleWrap);

    // 印刷页码：只读展示，缺失时显示破折号
    var printedCell = el("td");
    var printedValue = item.printed === null || item.printed === undefined || item.printed === ""
      ? ""
      : String(item.printed);
    var printed = el("span", "printed-val", printedValue || "—");
    if (!printedValue) printed.classList.add("is-missing");
    if (note) printed.title = note;
    printedCell.appendChild(printed);

    // PDF 页码：可编辑
    var pageCell = el("td");
    var pageInput = el("input", "cell-input page-input");
    pageInput.type = "number";
    pageInput.min = "1";
    pageInput.step = "1";
    pageInput.inputMode = "numeric";
    pageInput.setAttribute("aria-label", "PDF 页码");
    if (Number.isFinite(Number(pages)) && Number(pages) > 0) {
      pageInput.max = String(Number(pages));
    }
    if (item.page !== null && item.page !== undefined && item.page !== "") {
      pageInput.value = String(item.page);
    }
    pageCell.appendChild(pageInput);

    // 删除
    var actionCell = el("td");
    var deleteBtn = el("button", "del-btn", "删除");
    deleteBtn.type = "button";
    deleteBtn.title = "删除这一条";
    deleteBtn.setAttribute("aria-label", "删除这一条目录");
    actionCell.appendChild(deleteBtn);

    row.appendChild(levelCell);
    row.appendChild(titleCell);
    row.appendChild(printedCell);
    row.appendChild(pageCell);
    row.appendChild(actionCell);
    return row;
  }

  function refreshStats(card) {
    var rows = card.tbody.querySelectorAll("tr.toc-row");
    var counts = { 1: 0, 2: 0, 3: 0 };
    var notes = 0;

    Array.prototype.forEach.call(rows, function (row) {
      var level = normalizeLevel(row.dataset.level);
      counts[level] += 1;
      if (row.querySelector(".note-chip")) notes += 1;
    });

    var total = rows.length;
    card.rowCount = total;

    var text = "共 " + total + " 条";
    if (total > 0) {
      text += " · 一级 " + counts[1] + " · 二级 " + counts[2] + " · 三级 " + counts[3];
      if (notes > 0) text += " · 含提示 " + notes + " 条";
    }
    card.statsEl.textContent = text;

    syncEmptyRow(card);
    card.buildBtn.disabled = total === 0 || card.status === "building";

    if (total === 0) {
      setBuildHint(card, "目录已清空，无法生成。", false);
    }
  }

  function syncEmptyRow(card) {
    var existing = card.tbody.querySelector(".empty-row");
    if (card.rowCount === 0) {
      if (!existing) {
        var row = document.createElement("tr");
        row.className = "empty-row";
        var cell = el("td", "", "目录为空，无法生成书签。");
        cell.colSpan = 5;
        row.appendChild(cell);
        card.tbody.appendChild(row);
      }
    } else if (existing) {
      existing.remove();
    }
  }

  /* ============================================================
     分析结果渲染
     ============================================================ */

  function renderAnalyzeResult(card) {
    var job = card.job || {};
    var items = Array.isArray(job.items) ? job.items.filter(function (item) {
      return item && typeof item === "object";
    }) : [];
    var pages = Number(job.pages);

    card.fileNameEl.textContent = typeof job.name === "string" && job.name.trim()
      ? job.name
      : (card.file && card.file.name) || "未命名.pdf";

    card.metaEl.replaceChildren(
      metaItem("页数", Number.isFinite(pages) && pages > 0 ? pages + " 页" : "—"),
      metaItem("类型", describeKind(job)),
      metaItem("目录页", formatTocPages(job.toc_pages)),
      metaItem("页码偏移", formatOffset(job.offset), "PDF 页码 = 印刷页码 + 页码偏移"),
      metaItem("耗时", formatSeconds(job.elapsed))
    );

    if (Array.isArray(job.checks) && job.checks.length > 0) {
      var passed = job.checks.filter(function (check) {
        return check && check.ok === true;
      }).length;
      var checkItem = metaItem("抽检", passed + "/" + job.checks.length + " 通过");
      checkItem.title = "抽查各章起始页的页眉文字与目录标题是否对得上";
      card.metaEl.appendChild(checkItem);
    }
    card.metaEl.hidden = false;

    if (job.id) {
      card.jobLineEl.textContent = "任务 " + job.id;
      card.jobLineEl.hidden = false;
    } else {
      card.jobLineEl.hidden = true;
    }

    card.tbody.replaceChildren();
    var fragment = document.createDocumentFragment();
    items.forEach(function (item) {
      fragment.appendChild(createTocRow(item, pages));
    });
    card.tbody.appendChild(fragment);

    if (items.length === 0) {
      var notice = el("div", "alert alert-warn");
      notice.appendChild(el(
        "span",
        "alert-text",
        "没有识别到目录条目。请确认这本书有文字目录页，或重新分析一次。"
      ));
      var retry = el("button", "btn btn-small", "重新分析");
      retry.type = "button";
      retry.addEventListener("click", function () { retryAnalyze(card); });
      notice.appendChild(retry);
      card.noticeSlot.replaceChildren(notice);
    } else {
      card.noticeSlot.replaceChildren();
    }

    // 识别完成后收起进度面板，只留结果表格
    card.statusSlot.replaceChildren();
    card.statusSlot.hidden = true;

    card.resultEl.hidden = false;
    card.tableWrap.hidden = false;
    card.collapseBtn.disabled = false;
    card.collapseBtn.textContent = "收起目录";
    card.collapseBtn.setAttribute("aria-expanded", "true");
    card.buildBtn.textContent = "生成带书签的 PDF";
    card.buildHint.textContent = DEFAULT_BUILD_HINT;
    card.buildHint.classList.remove("is-working");
    clearBuildAlert(card);

    setStatus(card, "ready");
    refreshStats(card);
    if (items.length === 0) {
      setBuildHint(card, "没有目录条目，无法生成。", false);
    }
  }

  /* ============================================================
     队列：一次只分析一个文件
     ============================================================ */

  function enqueueCard(card) {
    if (card.status === "queued" || card.status === "analyzing") return;
    card.failure = null;
    setStatus(card, "queued");
    renderQueuedPanel(card);
    state.queue.push(card);
    updateQueuedPositions();
    updateQueueNote();
  }

  function retryAnalyze(card) {
    if (!card.file) return;
    if (card.status === "analyzing" || card.status === "building" || card.status === "queued") {
      return;
    }
    stopElapsed(card);
    card.job = null;
    card.failure = null;
    card.statusSlot.replaceChildren();
    card.resultEl.hidden = true;
    card.metaEl.hidden = true;
    card.jobLineEl.hidden = true;
    card.noticeSlot.replaceChildren();
    card.tbody.replaceChildren();
    card.rowCount = 0;
    clearBuildAlert(card);
    enqueueCard(card);
    pumpQueue();
    card.root.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  async function analyzeCard(card) {
    setStatus(card, "analyzing");
    renderAnalyzingPanel(card);
    updateQueueNote();
    updateQueuedPositions();

    var form = new FormData();
    form.append("file", card.file, card.file.name || "book.pdf");

    try {
      var data = await fetchJson(API.analyze, { method: "POST", body: form });
      assertOk(data, "分析失败，后端没有返回原因。");
      if (!data.job || typeof data.job !== "object") {
        throw new Error("后端返回的任务数据不完整。");
      }
      card.job = data.job;
      card.failure = null;
      renderAnalyzeResult(card);

      var count = Array.isArray(card.job.items) ? card.job.items.length : 0;
      showToast("识别完成，共 " + count + " 条目录。", "ok");
    } catch (error) {
      card.failure = {
        stage: "analyze",
        message: error && error.message ? error.message : String(error)
      };
      setStatus(card, "error");
      renderAnalyzeError(card);
      showToast("识别失败，请查看任务卡片上的说明。", "error");
    } finally {
      stopElapsed(card);
      updateQueueNote();
      updateQueuedPositions();
    }
  }

  async function pumpQueue() {
    if (state.pumping) return;
    state.pumping = true;

    try {
      while (state.queue.length > 0) {
        var card = state.queue.shift();
        if (!card || card.status !== "queued") continue;
        updateQueuedPositions();
        updateQueueNote();
        await analyzeCard(card);
      }
    } finally {
      state.pumping = false;
      updateQueueNote();
      updateQueuedPositions();
    }
  }

  /* ============================================================
     生成与下载
     ============================================================ */

  function ItemError(message, input) {
    this.name = "ItemError";
    this.message = message;
    this.input = input || null;
  }

  ItemError.prototype = Object.create(Error.prototype);
  ItemError.prototype.constructor = ItemError;

  function collectItems(card) {
    var rows = Array.prototype.slice.call(card.tbody.querySelectorAll("tr.toc-row"));
    if (rows.length === 0) {
      throw new ItemError("目录为空，至少保留一条条目再生成。");
    }

    var maxPage = card.job && Number.isFinite(Number(card.job.pages))
      ? Number(card.job.pages)
      : 0;
    var items = [];

    rows.forEach(function (row, index) {
      var levelSelect = row.querySelector(".level-select");
      var titleInput = row.querySelector(".title-input");
      var pageInput = row.querySelector(".page-input");
      var title = titleInput ? titleInput.value.trim() : "";
      var pageText = pageInput ? pageInput.value.trim() : "";
      var page = Number(pageText);
      var rowNumber = index + 1;

      if (!title) {
        throw new ItemError(
          "第 " + rowNumber + " 条目录的标题为空，请补上标题或删除这一行。",
          titleInput
        );
      }
      if (!pageText || !Number.isInteger(page) || page < 1) {
        throw new ItemError(
          "第 " + rowNumber + " 条目录的 PDF 页码无效，请填入正整数。",
          pageInput
        );
      }
      if (maxPage && page > maxPage) {
        throw new ItemError(
          "第 " + rowNumber + " 条目录的 PDF 页码 " + page +
          " 超出范围（1–" + maxPage + "）。",
          pageInput
        );
      }

      items.push({
        level: normalizeLevel(levelSelect ? levelSelect.value : 1),
        title: title,
        page: page
      });
    });

    return items;
  }

  function clearInputErrors(card) {
    Array.prototype.forEach.call(
      card.tbody.querySelectorAll(".is-invalid"),
      function (input) {
        input.classList.remove("is-invalid");
        input.removeAttribute("aria-invalid");
      }
    );
  }

  function setBuildHint(card, text, working) {
    card.buildHint.textContent = text;
    card.buildHint.classList.toggle("is-working", Boolean(working));
  }

  function clearBuildAlert(card) {
    card.buildAlertSlot.replaceChildren();
  }

  function showBuildAlert(card, message) {
    var alertBox = el("div", "alert alert-error");
    alertBox.appendChild(el("span", "alert-text", message));
    card.buildAlertSlot.replaceChildren(alertBox);
  }

  function showBuildSuccess(card, downloadUrl, outName, count) {
    var alertBox = el("div", "alert alert-ok");
    alertBox.appendChild(el(
      "span",
      "alert-text",
      "已生成「" + outName + "」，共 " + count + " 条书签。"
    ));
    var link = el("a", "", "重新下载");
    link.href = downloadUrl;
    link.download = outName;
    link.rel = "noopener";
    alertBox.appendChild(link);
    card.buildAlertSlot.replaceChildren(alertBox);
  }

  function triggerDownload(url, filename) {
    var link = document.createElement("a");
    link.href = url;
    if (filename) link.download = filename;
    link.rel = "noopener";
    link.style.display = "none";
    document.body.appendChild(link);
    link.click();
    link.remove();
  }

  function setTableLocked(card, locked) {
    card.tableWrap.classList.toggle("is-locked", locked);
    if ("inert" in card.tableWrap) card.tableWrap.inert = locked;
    card.tableWrap.setAttribute("aria-busy", locked ? "true" : "false");
    card.collapseBtn.disabled = locked;
  }

  async function buildBookmarkedPdf(card) {
    if (!card.job || card.status === "building" || card.status === "analyzing") return;

    var jobId = card.job.id === null || card.job.id === undefined
      ? ""
      : String(card.job.id);
    if (!jobId) {
      setStatus(card, "error");
      card.failure = { stage: "build", message: "缺少任务编号，请重新分析。" };
      updateBadge(card);
      showBuildAlert(card, "缺少任务编号，请重新分析。");
      return;
    }

    var items;
    try {
      items = collectItems(card);
    } catch (error) {
      clearInputErrors(card);
      showBuildAlert(card, error.message || "目录条目不完整。");
      if (error.input) {
        error.input.classList.add("is-invalid");
        error.input.setAttribute("aria-invalid", "true");
        error.input.focus({ preventScroll: true });
        error.input.scrollIntoView({ behavior: "smooth", block: "center" });
      }
      return;
    }

    clearInputErrors(card);
    clearBuildAlert(card);
    card.failure = null;
    setStatus(card, "building");
    setTableLocked(card, true);
    card.buildBtn.disabled = true;
    card.buildBtn.textContent = "正在生成…";
    setBuildHint(card, "正在写入书签并保存 PDF，请稍候…", true);

    try {
      var data = await fetchJson(API.build, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: jobId, items: items })
      });
      assertOk(data, "生成失败，后端没有返回原因。");

      var downloadUrl = resolveDownloadUrl(data.download_url, jobId);
      var outName = typeof data.out_name === "string" && data.out_name.trim()
        ? data.out_name.trim()
        : "bookmarked.pdf";
      var rawCount = Number(data.count);
      var count = Number.isInteger(rawCount) && rawCount >= 0 ? rawCount : items.length;

      setStatus(card, "done");
      showBuildSuccess(card, downloadUrl, outName, count);
      setBuildHint(card, "已生成，可修改目录后重新生成。", false);
      triggerDownload(downloadUrl, outName);
      showToast("已生成书签 PDF，开始下载。", "ok");
    } catch (error) {
      card.failure = {
        stage: "build",
        message: error && error.message ? error.message : String(error)
      };
      setStatus(card, "error");
      showBuildAlert(card, "生成失败：" + card.failure.message);
      setBuildHint(card, "生成失败，修改后可重试。", false);
      showToast("生成失败，请查看卡片上的说明。", "error");
    } finally {
      setTableLocked(card, false);
      card.buildBtn.disabled = card.rowCount === 0;
      card.buildBtn.textContent = card.status === "done"
        ? "重新生成 PDF"
        : "生成带书签的 PDF";
    }
  }

  /* ============================================================
     编辑、删除、移除卡片
     ============================================================ */

  function markDirty(card) {
    if (!card.job || card.status === "building" || card.status === "analyzing") return;

    if (card.status === "done") {
      setStatus(card, "ready");
    }
    if (card.status === "error" && card.failure && card.failure.stage === "build") {
      card.failure = null;
      setStatus(card, "ready");
    }
    if (card.status === "ready") {
      clearBuildAlert(card);
      setBuildHint(card, DEFAULT_BUILD_HINT, false);
      card.buildBtn.textContent = "生成带书签的 PDF";
    }
  }

  function toggleCollapse(card) {
    var collapse = !card.tableWrap.hidden;
    card.tableWrap.hidden = collapse;
    card.collapseBtn.textContent = collapse ? "展开目录" : "收起目录";
    card.collapseBtn.setAttribute("aria-expanded", collapse ? "false" : "true");
  }

  function resetRemoveButton(card) {
    if (card.removeTimer) {
      window.clearTimeout(card.removeTimer);
      card.removeTimer = 0;
    }
    card.removeArmed = false;
    if (card.removeBtn) {
      card.removeBtn.textContent = "移除";
      card.removeBtn.classList.remove("is-danger");
    }
  }

  function removeCard(card) {
    resetRemoveButton(card);
    var index = state.queue.indexOf(card);
    if (index !== -1) state.queue.splice(index, 1);
    stopElapsed(card);
    card.root.remove();
    state.cards.delete(card.id);
    updateQueueNote();
    updateQueuedPositions();
    updateEmptyHint();
  }

  function handleRemoveClick(card) {
    if (card.status === "analyzing" || card.status === "building") {
      showToast("任务正在处理中，完成后再移除。", "warn");
      resetRemoveButton(card);
      return;
    }
    if (!card.removeArmed) {
      card.removeArmed = true;
      card.removeBtn.textContent = "确认移除";
      card.removeBtn.classList.add("is-danger");
      card.removeTimer = window.setTimeout(function () {
        resetRemoveButton(card);
      }, 3000);
      return;
    }
    removeCard(card);
  }

  function bindCardEvents(card) {
    card.removeBtn.addEventListener("click", function () { handleRemoveClick(card); });
    card.collapseBtn.addEventListener("click", function () { toggleCollapse(card); });
    card.buildBtn.addEventListener("click", function () { buildBookmarkedPdf(card); });

    card.tbody.addEventListener("change", function (event) {
      var select = event.target.closest(".level-select");
      if (!select) return;
      var row = select.closest("tr.toc-row");
      if (!row) return;
      applyRowLevel(row, select.value);
      markDirty(card);
      refreshStats(card);
    });

    card.tbody.addEventListener("input", function (event) {
      var target = event.target;
      if (!target.classList.contains("title-input") && !target.classList.contains("page-input")) {
        return;
      }
      target.classList.remove("is-invalid");
      target.removeAttribute("aria-invalid");
      markDirty(card);
    });

    card.tbody.addEventListener("click", function (event) {
      var deleteButton = event.target.closest(".del-btn");
      if (!deleteButton) return;
      if (card.status === "building") return;
      var row = deleteButton.closest("tr.toc-row");
      if (!row) return;
      row.remove();
      markDirty(card);
      refreshStats(card);
    });
  }

  /* ============================================================
     文件入队与拖放
     ============================================================ */

  function handleFiles(fileList) {
    var files = Array.prototype.slice.call(fileList || []);
    if (files.length === 0) return;

    var pdfFiles = files.filter(isPdfFile);
    var skipped = files.length - pdfFiles.length;
    if (skipped > 0) {
      showToast("已跳过 " + skipped + " 个非 PDF 文件。", "warn");
    }
    if (pdfFiles.length === 0) {
      showToast("没有找到可分析的 PDF 文件。", "warn");
      return;
    }

    var firstCard = null;
    pdfFiles.forEach(function (file) {
      var card = createCard(file);
      enqueueCard(card);
      if (!firstCard) firstCard = card;
    });

    if (firstCard) {
      window.requestAnimationFrame(function () {
        firstCard.root.scrollIntoView({ behavior: "smooth", block: "nearest" });
      });
    }

    pumpQueue();
    updateQueueNote();
  }

  function hasFilePayload(event) {
    var transfer = event.dataTransfer;
    if (!transfer) return false;
    if (transfer.types) {
      for (var i = 0; i < transfer.types.length; i += 1) {
        if (transfer.types[i] === "Files") return true;
      }
    }
    return Boolean(transfer.files && transfer.files.length > 0);
  }

  function showDropOverlay() {
    if (dropOverlay.hidden) {
      dropOverlay.hidden = false;
      dropOverlay.setAttribute("aria-hidden", "false");
    }
  }

  function hideDropOverlay() {
    if (!dropOverlay.hidden) {
      dropOverlay.hidden = true;
      dropOverlay.setAttribute("aria-hidden", "true");
    }
  }

  function resetDragState() {
    state.dragDepth = 0;
    hideDropOverlay();
  }

  function handleDragEnter(event) {
    if (!hasFilePayload(event)) return;
    event.preventDefault();
    state.dragDepth += 1;
    showDropOverlay();
  }

  function handleDragOver(event) {
    if (!hasFilePayload(event)) return;
    event.preventDefault();
    if (event.dataTransfer) event.dataTransfer.dropEffect = "copy";
    showDropOverlay();
  }

  function handleDragLeave() {
    if (state.dragDepth === 0) return;
    state.dragDepth = Math.max(0, state.dragDepth - 1);
    if (state.dragDepth === 0) hideDropOverlay();
  }

  function handleDrop(event) {
    if (!hasFilePayload(event)) return;
    event.preventDefault();
    resetDragState();
    var files = event.dataTransfer && event.dataTransfer.files;
    if (files && files.length > 0) handleFiles(files);
  }

  /* ============================================================
     静态事件与初始化
     ============================================================ */

  function bindStaticEvents() {
    Array.prototype.forEach.call(
      document.querySelectorAll('[data-action="pick"]'),
      function (button) {
        button.addEventListener("click", function () {
          fileInput.value = "";
          fileInput.click();
        });
      }
    );

    fileInput.addEventListener("change", function () {
      handleFiles(fileInput.files);
      fileInput.value = "";
    });

    pingBtn.addEventListener("click", checkBackend);

    window.addEventListener("dragenter", handleDragEnter);
    window.addEventListener("dragover", handleDragOver);
    window.addEventListener("dragleave", handleDragLeave);
    window.addEventListener("drop", handleDrop);
    window.addEventListener("dragend", resetDragState);
    window.addEventListener("blur", resetDragState);

    document.addEventListener("visibilitychange", function () {
      if (document.hidden) resetDragState();
    });

    window.addEventListener("keydown", function (event) {
      if (event.key === "Escape") resetDragState();
    });
  }

  function init() {
    bindStaticEvents();
    updateEmptyHint();
    updateQueueNote();
    checkBackend();
  }

  init();
})();
</script>
</body>
</html>
